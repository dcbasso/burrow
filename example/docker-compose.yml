# Ambiente de demonstração do Burrow: sobe a stack inteira já populada com serviços
# fictícios. Isolado do compose de produção da raiz — volume e nomes próprios, então
# rodar isto não encosta nos seus dados reais.
#
#   cp .env.example .env   # ponha o seu e-mail em ALLOWED_EMAILS
#   docker compose up -d --build
#
# Depois: http://localhost:8090

name: burrow-demo

services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    environment:
      # Dá o contexto de banco em que os scripts de init rodam.
      MONGO_INITDB_DATABASE: burrow_demo
    volumes:
      - demo-data:/data/db
      # Só executa na primeira subida, com o volume vazio. Nunca sobrescreve nada.
      - ./seed:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: ../backend
    restart: unless-stopped
    environment:
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/burrow_demo
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      ALLOWED_EMAILS: ${ALLOWED_EMAILS}
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5

  web:
    build: ../frontend
    restart: unless-stopped
    ports:
      # Se a 8090 já estiver ocupada (ex.: pelo seu Burrow de verdade), defina
      # WEB_PORT no .env — e lembre de adicionar a nova origem no Google Console.
      - "${WEB_PORT:-8090}:80"
    depends_on:
      - api

volumes:
  demo-data:
